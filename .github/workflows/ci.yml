# CI for llm-context: catch malformed skills and broken builds before they
# silently degrade skill triggering or adapter generation.
#
# Note: `build-adapters.sh --check` is inherently local — it diffs against the
# adapters installed in $HOME — so CI runs a smoke build into a throwaway HOME
# instead. The real drift check runs in this repo's pre-commit.local
# (bin/git-hooks/pre-commit-local.llm-context).
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  portable:
    name: portable (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Lint repository
        run: bin/lint-skills.sh
      - name: Verify vendor lock
        run: bin/check-vendor-lock.sh
      - name: Run tests
        run: tests/run.sh
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: bin/check-release-tag.sh "$GITHUB_REF_NAME"
      - name: Smoke-test installation
        run: |
          test_home="$(mktemp -d)"
          HOME="$test_home" bin/build-adapters.sh
          HOME="$test_home" bin/build-adapters.sh --check
          HOME="$test_home" bin/llmctx skills install

  quality:
    name: pre-commit quality checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pre-commit
        run: python3 -m pip install pre-commit
      - name: Run all quality hooks
        run: pre-commit run --all-files
