# A destination with one instance and no pattern yet.
#
# This file deliberately declares nothing to check. A target file earns its
# fields by being modelled on a project that exists; inventing them ahead of a
# second instance produces fields nobody fills in, and an unfilled field in a
# deploy configuration reads as a decision when it is an omission.
#
# When a second project ships to the same kind of destination, copy this to
# <name>.conf and fill it in from both.
description=A destination without a target file yet
onboard_hint=Record the steps somewhere the next clone will find them. When a second project ships here, turn this into its own target file modelled on both.
offboard_hint=Whatever the onboarding granted, in reverse. Revocation is server-side and needs a human.
