# App or static site built and hosted by AWS Amplify.
# Modelled on lucyheritage.com (Gen 2, with a backend) and emergentlabs.xyz.
#
# Unlike Pages, the build configuration is committed — amplify.yml, and
# customHttp.yml where headers are set — so a fresh clone can read what will
# run. What it cannot read is which account it lands in, hence the profile.
#
# requires_env is AWS_PROFILE alone, on evidence rather than symmetry: the real
# project declares a profile and no region. Region is knowable (it sits in that
# repo's deployment notes and a compose default) but it is not what a clone
# needs to resolve, and requiring it would flag a project that deploys fine.
#
# AWS_BRANCH and AWS_APP_ID appear in amplify.yml and are supplied by Amplify's
# own build environment, not by a developer, so they are not declared here.
description=App or static site built and hosted by AWS Amplify
requires_env=AWS_PROFILE
requires_cli=aws
check_files=amplify.yml
skills=website
onboard_hint=Connect the repository in the Amplify console under the account the declared profile reads, then confirm the branch mapping and the region. Verify the profile is the read-only one; a deploy is a separate, deliberate act under a different profile.
offboard_hint=Delete the Amplify app, remove the repository connection, and confirm the IAM role or SSO permission set that granted deploy access is gone. The app deleting does not revoke the access that created it.
