# App or static site built and hosted by AWS Amplify.
# Modelled on lucyheritage.com and emergentlabs.xyz.
#
# Unlike Pages, the build configuration is committed (customHttp.yml, and
# amplify.yml where one exists), so a fresh clone can read what will run. What
# it cannot read is which account it lands in — hence the declared profile.
description=App or static site built and hosted by AWS Amplify
requires_env=AWS_PROFILE,AWS_REGION
requires_cli=aws
check_files=customHttp.yml
skills=website
onboard_hint=Connect the repository in the Amplify console under the account the declared profile reads, then confirm the branch mapping. Verify the profile is the read-only one; a deploy is a separate, deliberate act under a different profile.
offboard_hint=Delete the Amplify app, remove the repository connection, and confirm the IAM role or SSO permission set that granted deploy access is gone. The app deleting does not revoke the access that created it.
