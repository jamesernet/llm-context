# Static or pre-rendered site built by Cloudflare Pages from a branch.
# Modelled on jamesernet.com.
#
# There is no deploy command and no token in the ordinary case: Pages builds on
# push through the git integration. That is why `requires_cli` is empty and
# wrangler is optional — a project only needs it for Functions, secrets or a
# manual deploy, and most do not.
description=Static site built by Cloudflare Pages from a branch
optional_cli=wrangler
optional_secrets=CLOUDFLARE_API_TOKEN
check_files=_headers,_redirects
skills=website
onboard_hint=Connect the repository in the Pages dashboard, then set the build command and output directory there. Both live in Cloudflare, not in this repo, which is why a fresh clone cannot tell you what they are.
offboard_hint=Delete the Pages project, remove the deploy hook from the repository, and revoke the API token in the vault if one was issued.
